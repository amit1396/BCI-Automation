    )

  inputs:
    mavenPomFile: 'pom.xml'

    goals: 'test'

    options: >
      -Dbrowser=${{ lower(parameters.BROWSER) }}
      -Denv=${{ parameters.ENV }}
      -Duser.timezone=Asia/Kolkata
